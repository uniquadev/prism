[project]
name = "prism-protocol"
version = "1.0.0"
description = "PRISM Protocol 1.0 serialization, state, and AM coordination library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "scapy>=2.7.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
