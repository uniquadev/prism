[project]
name = "prism-experiment-single-port-latency"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["prism-ccl", "prism-experiments[rtl]", "matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.11"]

[tool.uv]
package = false

[tool.uv.sources]
prism-ccl = { path = "../../repo/prism-ccl", editable = true }
prism-experiments = { path = "../run", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
