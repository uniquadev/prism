site_name: PRISM
site_description: Bachelor thesis documentation for primitive hardware for network computing.
site_author: Lorenzo Cipolletti
site_url: https://prism.uniqua.dev/
copyright: Copyright &copy; 2026 Sapienza University of Rome

docs_dir: docs
site_dir: site

# watch:
#   - docs/includes

draft_docs: |
  /chapters/1-introduction/index.md
  **/*.example.md

theme:
  name: material
  language: en
  favicon: assets/images/favicon.svg
  icon:
    logo: fontawesome/solid/cube
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: it
          name: Italiano
          build: true
          site_description: Documentazione della tesi su primitive hardware per il calcolo in rete.
          theme:
            language: it
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: black
                accent: blue
                toggle:
                  icon: material/weather-night
                  name: Passa alla modalità scura
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: black
                accent: blue
                toggle:
                  icon: material/weather-sunny
                  name: Passa alla modalità chiara
          extra:
            generator: false
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/uniquadev/prism
                name: PRISM su GitHub
          nav_translations:
            "1. Introduction": "1. Introduzione"
            "1.1 Floating-Point Reproducibility": "1.1 Riproducibilità in virgola mobile"
            "2. Getting Started": "2. Per iniziare"
            "3. Architecture": "3. Architettura"
            "3.1 Protocol": "3.1 Protocollo"
            "3.2 Pipeline": "3.2 Pipeline"
            "3.4 Parameters": "3.4 Parametri"
            "3.5 Interfaces": "3.5 Interfacce"
            "4. Results": "4. Risultati"
            "4.1 Verification Evidence": "4.1 Evidenze di verifica"
            "5. Future Works": "5. Sviluppi futuri"
            "5.1 Protocol": "5.1 Protocollo"
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: false
      enable_git_follow: false
      fallback_to_build_date: true
      strict: false
      type: date
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
  - minify_html:
      minify_css: true
      minify_js: true

nav:
  - "1. Introduction":
      - index.md
      - "1.1 Floating-Point Reproducibility": chapters/1-introduction/reproducibility.md
  - "2. Getting Started":
      - chapters/2-getting-started/index.md
  - "3. Architecture":
      - chapters/3-architecture/index.md
      - "3.1 Protocol": chapters/3-architecture/1.protocol.md
      - "3.2 Pipeline": chapters/3-architecture/2.pipeline.md
      - "3.4 Parameters": chapters/3-architecture/4.parameters.md
      - "3.5 Interfaces":
        - chapters/3-architecture/4-interfaces/index.md
        - "Shared contracts": chapters/3-architecture/4-interfaces/common-contracts.md
        - "Top-level modules":
          - "prism_switch_top": chapters/3-architecture/4-interfaces/top/prism_switch_top.md
          - "prism_switch_core": chapters/3-architecture/4-interfaces/top/prism_switch_core.md
        - "Main units":
          - "prism_ingress_unit": chapters/3-architecture/4-interfaces/units/prism_ingress_unit.md
          - "prism_forwarding_unit": chapters/3-architecture/4-interfaces/units/prism_forwarding_unit.md
          - "prism_management_unit": chapters/3-architecture/4-interfaces/units/prism_management_unit.md
          - "prism_collective_unit": chapters/3-architecture/4-interfaces/units/prism_collective_unit.md
          - "prism_result_delivery_unit": chapters/3-architecture/4-interfaces/units/prism_result_delivery_unit.md
          - "prism_reliability_unit": chapters/3-architecture/4-interfaces/units/prism_reliability_unit.md
          - "prism_egress_unit": chapters/3-architecture/4-interfaces/units/prism_egress_unit.md
        - "Stream components":
          - "prism_packet_fifo": chapters/3-architecture/4-interfaces/components/stream/prism_packet_fifo.md
          - "prism_packet_store": chapters/3-architecture/4-interfaces/components/stream/prism_packet_store.md
          - "prism_header_parser": chapters/3-architecture/4-interfaces/components/stream/prism_header_parser.md
          - "prism_packet_validator": chapters/3-architecture/4-interfaces/components/stream/prism_packet_validator.md
          - "prism_admission_controller": chapters/3-architecture/4-interfaces/components/stream/prism_admission_controller.md
          - "prism_voq_bank": chapters/3-architecture/4-interfaces/components/stream/prism_voq_bank.md
          - "prism_packet_arbiter": chapters/3-architecture/4-interfaces/components/stream/prism_packet_arbiter.md
          - "prism_stream_crossbar": chapters/3-architecture/4-interfaces/components/stream/prism_stream_crossbar.md
          - "prism_egress_buffer": chapters/3-architecture/4-interfaces/components/stream/prism_egress_buffer.md
          - "prism_packet_serializer": chapters/3-architecture/4-interfaces/components/stream/prism_packet_serializer.md
        - "Collective components":
          - "prism_collective_context_table": chapters/3-architecture/4-interfaces/components/collective/prism_collective_context_table.md
          - "prism_contribution_tracker": chapters/3-architecture/4-interfaces/components/collective/prism_contribution_tracker.md
          - "prism_data_depacketizer": chapters/3-architecture/4-interfaces/components/collective/prism_data_depacketizer.md
          - "prism_accumulation_scheduler": chapters/3-architecture/4-interfaces/components/collective/prism_accumulation_scheduler.md
          - "prism_accumulator_store": chapters/3-architecture/4-interfaces/components/collective/prism_accumulator_store.md
          - "prism_output_range_tracker": chapters/3-architecture/4-interfaces/components/collective/prism_output_range_tracker.md
          - "prism_output_packetizer": chapters/3-architecture/4-interfaces/components/collective/prism_output_packetizer.md
          - "prism_result_replicator": chapters/3-architecture/4-interfaces/components/collective/prism_result_replicator.md
        - "Reliability components":
          - "prism_progress_engine": chapters/3-architecture/4-interfaces/components/reliability/prism_progress_engine.md
          - "prism_replay_cache": chapters/3-architecture/4-interfaces/components/reliability/prism_replay_cache.md
          - "prism_retry_timer": chapters/3-architecture/4-interfaces/components/reliability/prism_retry_timer.md
        - "Arithmetic components":
          - "prism_fp32_input_converter": chapters/3-architecture/4-interfaces/components/arithmetic/prism_fp32_input_converter.md
          - "prism_accumulator_backend_dispatcher": chapters/3-architecture/4-interfaces/components/arithmetic/prism_accumulator_backend_dispatcher.md
          - "prism_fp32_alu": chapters/3-architecture/4-interfaces/components/arithmetic/prism_fp32_alu.md
          - "prism_fp32_alu_array": chapters/3-architecture/4-interfaces/components/arithmetic/prism_fp32_alu_array.md
          - "prism_fp32_output_converter": chapters/3-architecture/4-interfaces/components/arithmetic/prism_fp32_output_converter.md
  - "4. Results":
      - chapters/4-results/index.md
      - "4.1 Verification Evidence": chapters/4-results/verification.md
  - "5. Future Works":
    - chapters/5-future-works/index.md
    - "5.1 Protocol": chapters/5-future-works/protocol.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uniquadev/prism
      name: PRISM on GitHub

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid.js
  - assets/javascripts/tables.js
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
